# gitleaks config for Grobase — complements the TruffleHog CI gate
# (mini-baas-security.yml) with regex/entropy scanning.
#
# What is scanned: scripts/ci/check-secrets.sh feeds gitleaks the GIT-VISIBLE tree
# (tracked + untracked-not-ignored), and .githooks/pre-commit feeds it the staged diff.
# Gitignored local secret files (.env, .env.secrets, .env.local, *-tenant.env, certs/)
# are therefore never scanned and never need an allowlist entry — and the moment one
# is force-added it is staged, so the pre-commit pass sees it.
#
# Allowlist policy: FILES, not directories. vendor/ and scripts/seed/ are scanned —
# a whole-tree allowlist is how live Supabase/Atlas DSNs sat in vendor/ unseen
# (docs/infrastructure/incident-2026-10.md). Add a fixture by its exact path.

title = "grobase gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "grobase-api-key"
description = "Grobase tenant API key (mbk_…)"
regex = '''\bmbk_[A-Za-z0-9_-]{24,}'''
keywords = ["mbk_"]

[[rules]]
id = "credentialed-dsn"
description = "Connection string with an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|sqlserver)://[^:/@\s'"`]+:([^@\s'"`$<{}]{8,})@[^\s'"`]+'''
secretGroup = 1
entropy = 3.0
keywords = ["://"]

[[allowlists]]
description = "Build output, lockfiles, named fixture files, and known non-secret values"

paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist(-local|-native)?/''',
  '''(^|/)target/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)infra/config/openapi/.*\.json$''',
  '''(^|/)infra/config/audit/issues-.*\.json$''',
  '''(^|/)src/coverage/''',
  # committed templates: values are empty or CHANGE_ME by construction (m214 asserts it)
  '''^\.env\.example$''',
  '''^\.env\.local\.example$''',
  '''^infra/config/cloud/flags\.env\.example$''',
  # deliberately fake tokens that exercise assemble-env's GitHub-token filter
  '''^scripts/test/assemble-env-test\.sh$''',
  # test code: deterministic fixtures by design. These are OUR test trees only —
  # vendor/ and scripts/seed/ stay scanned.
  '''^src/control-plane/.*_test\.go$''',
  '''^scripts/verify/m[0-9]+-[^/]+\.sh$''',
  '''^scripts/test/phase/phase[0-9]+-[^/]+\.sh$''',
  # CircleCI status-badge token (read-only badge, not a credential)
  '''^vendor/music-room/back/README\.md$''',
  # Kong admin-API docs: ALL_CAPS header placeholders, not key material. File-scoped
  # on purpose — an ALL_CAPS *regex* would hide every upper-case secret repo-wide.
  '''^infra/docker/services/kong/README\.md$''',
]

# regexes below are matched against the SECRET only (regexTarget default). Each entry names one known non-secret value;
# no bare words that a real credential could contain.
regexes = [
  '''^replace-with-[a-z0-9-]+$''',
  '''^anon-key-placeholder$''',
  '''(?i)^public-anon-key$''',
  '''^\$\{?[A-Z_]+\}?$''',
  '''^your-super-secret-and-long-postgres-password$''',
  '''^ci-jwt-secret-min-32-chars-long-xx$''',
  '''^m195-dummy-jwt-secret-m195-dummy-jwt$''',
  '''^jwt-test-secret-at-least-32-characters-long$''',
  '''^ci-adapter-token$''',
  '''^minioadmin$''',
  '''(?i)^change[-_]?me''',
  '''^<redacted>$''',
  '''^m[0-9]+-[a-z]+-key-[0-9a-f]+$''',
  '''^X25519SCOPE[A-Z]+$''',
  # shell/env references, never values: "${SONAR_TOKEN}:", $TOKEN
  '''^["']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?:?["']?$''',
  # Supabase PUBLISHABLE key: browser-public by design (category PUBLIC)
  '''^sb_publishable_[A-Za-z0-9_-]+$''',
  # SQL upsert column reference picked up by generic-api-key
  '''(?i)^[a-z_]+=excluded\.[a-z_]+$''',
]

# Line-scoped: the secret here is a bare UUID, and allowlisting UUIDs repo-wide would
# hide real UUID-shaped keys. Only the "api-key:<uuid>" owner-identity form is exempt.
[[allowlists]]
description = "api-key:<uuid> owner identity strings (a key ID, not key material)"
regexTarget = "line"
regexes = ['''"api-key:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''']

# vault42.conf — read by `make vault42-*` (orchestrators/makes/65-vault42.mk).
# INI, parsed as text, never executed. No credential belongs here: FT_PASSPHRASE etc.
# come from the environment only.
#
# Org: this file names `univers42`, the org the grobase project was created in on
# 2026-10-18. scripts/vault/ctl-env.sh keeps its older `univers-42` default untouched
# (it answered 404 for the operator on 2026-10-18); the two are reconciled by the
# operator, not by editing that script here (docs/adr/0001-vault42-cli-wiring.md).
#
# Dev only, on purpose. There is no [prod] target: the prod tree was pushed from a capture
# stage on sgoinfre that holds secrets/ only, not from a checkout, so a checkout-rooted
# prod target would replace that tree with the wrong files
# (.out-of-scope/grobase-vault42-prod-target.md). `make vault42-diff TARGET=prod` is
# refused by the CLI as an unknown target.

[dev]
org = univers42
project = grobase
env = dev
root = .
kinds = env secrets
mode = team
; Same set as scripts/vault/ctl-env.sh (VENDOR_PRIVATE + ALWAYS_PRIVATE): sealed to the
; pusher, not excluded. Caveat: matched by NAME; a credential not named like these is shared.
private = vendor/* secrets/*.env secrets/*cert* secrets/*key* secrets/.* *.local
; Tracked, public helper scripts: 42ctl takes every file below a directory named secrets, so they
; are in the tree, and the CLI refuses a push until each secrets/ path is private or shared.
shared = scripts/secrets/*

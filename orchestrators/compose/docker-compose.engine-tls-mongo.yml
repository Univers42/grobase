# docker-compose.engine-tls-mongo.yml — TLS on mongo and on every compose client that dials it
# (G5b, docs/adr/0012-g5b-engine-accept-tls.md; clients: docs/adr/0025-g5-mongo-clients-verify-the-engine-cert.md).
# Opt-in: ENGINE_TLS_ENGINES lists mongo (env, or an ENGINE_TLS_ENGINES= line in .env.local;
# orchestrators/makes/00-config.mk). ENGINE_TLS=1 alone never composes this file, so a
# Postgres-TLS host does not recreate mongo (G5b-C1). Dropping mongo from ENGINE_TLS_ENGINES
# reverts the server and every client below together.
#
# The cert comes from `scripts/certs/generate-engine-cert.sh mongo`, in a directory of its
# own: mounting certs/engines (Postgres's) or certs/ would hand mongo another key (G5b-C5).
# Clients get the public ca.pem only, as one file: the directory also holds engine-key.pem.
# Each DSN below restates its base value with the same ${…} interpolation, plus
# tls=true&tlsCAFile; every one keeps a "/" before "?" (the Go driver refuses "@mongo:27017?").
# ENGINE_TLS_MONGO_MODE: allowTLS (default) or requireTLS; anything else refuses to start.
#
# Caveat: requireTLS is a gate mode, not for a shared host. These still dial plaintext and
# break under it: pool mounts (scripts/seed/multidb-workspace-engines.sh, seed-live-demo.sh),
# the Trino catalog (infra/docker/services/trino/conf/catalog/mongodb.properties), the seed and
# verify scripts, an operator-set OUTBOX_MONGO_URL, which is used as set (only the default
# gains tls), and the nine Node services that take MONGO_URI from the host env through the
# ts-base anchor (config.env sets a plaintext mongodb://mongo:27017; m247 lists them as a SKIP).
# allowTLS keeps them working, unverified.
# Caveat: engine.pem lasts 397 days and every client now verifies it, so an expired cert is a
# client outage even in allowTLS (mongo-api, ai and analytics fail to boot; projections and
# mongo CDC degrade). Renew with `sh scripts/certs/generate-engine-cert.sh mongo` (it re-issues
# within 30 days of expiry), then recreate mongo: `docker compose -f docker-compose.yml
# -f orchestrators/compose/docker-compose.engine-tls-mongo.yml --profile data-plane up -d
# --force-recreate mongo`. The CA is unchanged, so clients need no recreate.
x-mongo-ca: &mongo-ca
  type: bind
  source: ${ENGINE_TLS_MONGO_CERT_DIR:-./certs/engine-tls/mongo}/ca.pem
  target: /etc/engine-tls-ca/ca.pem
  read_only: true
  bind:
    create_host_path: false

services:
  mongo:
    user: "0"
    entrypoint:
      ["/bin/sh", "/usr/local/bin/engine-tls-drop.sh", "docker-entrypoint.sh"]
    environment:
      ENGINE_TLS_NAME: mongo
      ENGINE_TLS_UID: "999"
      ENGINE_TLS_GID: "999"
      ENGINE_TLS_MONGO_MODE: ${ENGINE_TLS_MONGO_MODE:-allowTLS}
    volumes:
      - type: bind
        source: ${ENGINE_TLS_MONGO_CERT_DIR:-./certs/engine-tls/mongo}
        target: /etc/engine-tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/docker/services/engine-tls/drop-entrypoint.sh
        target: /usr/local/bin/engine-tls-drop.sh
        read_only: true
    tmpfs:
      - /run/engine-tls:mode=0700
    # The base probe with --tls: the image's own HEALTHCHECK is plaintext and never passes
    # under requireTLS. m247 asserts it equals the base once the TLS flags are taken out.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --host mongo --tls --tlsCAFile /run/engine-tls/ca.pem --quiet --eval "try { rs.status().myState === 1 ? quit(0) : quit(1) } catch(e) { db.runCommand({ ping: 1 }).ok ? quit(0) : quit(1) }"',
        ]

  # The base script with --tls on both mongosh calls (m247 checks the rest is unchanged).
  mongo-init:
    volumes:
      - *mongo-ca
    entrypoint:
      - bash
      - -c
      - |
        # Defence in depth behind the healthcheck fix above: this container is
        # `restart: "no"`, so ONE refused connection used to leave the replica set
        # uninitiated for the whole life of the stack, with no second chance and
        # no failure anyone would notice until mongo-api crash-looped. Retry the
        # dial; the initiate itself is already idempotent (rs.status() first).
        for attempt in $$(seq 1 30); do
          if mongosh --host mongo --tls --tlsCAFile /etc/engine-tls-ca/ca.pem -u "$$MONGO_USER" -p "$$MONGO_PASS" \
               --authenticationDatabase admin --quiet --eval 'quit(0)' >/dev/null 2>&1; then
            break
          fi
          echo "mongo not reachable yet (attempt $$attempt/30)"; sleep 2
        done
        mongosh --host mongo --tls --tlsCAFile /etc/engine-tls-ca/ca.pem \
          -u "$$MONGO_USER" -p "$$MONGO_PASS" \
          --authenticationDatabase admin --quiet --eval '
            try { rs.status(); print("Replica set already initialised"); }
            catch(e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
              print("Replica set initiated — waiting for PRIMARY election…");
            }
            // Block until this node becomes PRIMARY (max ~30 s)
            let attempts = 0;
            while (!db.hello().isWritablePrimary && attempts < 30) {
              sleep(1000); attempts++;
            }
            if (db.hello().isWritablePrimary) print("Node is PRIMARY — ready");
            else { print("WARN: node not yet PRIMARY after 30 s"); quit(1); }
          '

  outbox-relay:
    volumes:
      - *mongo-ca
    environment:
      OUTBOX_MONGO_URL: ${OUTBOX_MONGO_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/mini_baas?authSource=admin&tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem}
      MONGO_URI: ${OUTBOX_MONGO_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/mini_baas?authSource=admin&tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem}

  analytics-service:
    volumes:
      - *mongo-ca
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/?tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem

  ai-service:
    volumes:
      - *mongo-ca
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/?tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem

  mongo-api:
    volumes:
      - *mongo-ca
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/?tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem

  orchestrator:
    volumes:
      - *mongo-ca
    environment:
      OUTBOX_MONGO_URL: ${OUTBOX_MONGO_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/mini_baas?authSource=admin&tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem}

  realtime:
    volumes:
      - *mongo-ca
    environment:
      REALTIME_MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_INITDB_ROOT_PASSWORD:?unset - run make env}@mongo:27017/?replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}&authSource=admin&tls=true&tlsCAFile=/etc/engine-tls-ca/ca.pem

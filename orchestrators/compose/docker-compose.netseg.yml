# docker-compose.netseg.yml — per-plane network segmentation (G-Net)
# ============================================================================
# Without this overlay every container shares the one `mini-baas` bridge, so
# the public edge (waf, kong), the scrapers and the user-code sandbox can open
# a raw socket to postgres:5432, redis:6379 or vault:8200. With it:
#
#   mini-baas   the app bridge — every service keeps it EXCEPT the engines and
#               vault, which `!override` takes them off.
#   net-data    the engines (postgres mysql mariadb cockroach mssql mongo redis
#               dynamodb-local) + every backend that dials one.
#   net-vault   vault + the services that read secrets from it + prometheus
#               (it scrapes vault's metrics).
#   net-registry  adapter-registry-go + kong. adapter-registry-go leaves the
#               app bridge: its register/list routes trust an asserted tenant
#               header with no credential, so only its callers may reach it —
#               the routers and tenant-control (net-data/net-vault), prometheus
#               (net-vault) and kong's /admin/v1 route (here).
#
# Two containers reach each other only if they share a bridge, so a service
# not joined below — waf, kong, studio, playground, loki, promtail,
# functions-runtime, mailpit, minio, the vendor frontends — cannot reach an
# engine or vault at all. minio stays on the app bridge on purpose: kong
# proxies presigned object URLs straight to it (S3 signatures guard it).
#
# Opt in:  make up NETSEG=1  (or add -f to any docker compose command).
# Proof:   scripts/verify/m66-netseg.sh — renders every service's networks,
#          checks each engine client shares a bridge with its engine and no
#          edge/observability service does, and probes a running segmented
#          stack from kong (refused) and query-router (connects).
#
# Ponytail: the bridges are plain (not `internal: true`): an engine attached
# only to an internal network cannot publish its dev host port. Egress control
# is the prod overlay's job, not this file's.
# ============================================================================

networks:
  net-data:
    driver: bridge
  net-vault:
    driver: bridge
  net-registry:
    driver: bridge

x-app-data: &app-data
  networks: [mini-baas, net-data]
x-app-data-vault: &app-data-vault
  networks: [mini-baas, net-data, net-vault]

services:
  # ── engines: off the app bridge ─────────────────────────────────────────
  postgres:
    networks: !override
      net-data:
        aliases: [db]
  mysql:
    networks: !override [net-data]
  mariadb:
    networks: !override [net-data]
  cockroach:
    networks: !override [net-data]
  mssql:
    networks: !override [net-data]
  mongo:
    networks: !override [net-data]
  redis:
    networks: !override [net-data]
  dynamodb-local:
    networks: !override [net-data]
  vault:
    networks: !override [net-vault]

  # ── routers + control plane: engines and vault ──────────────────────────
  query-router: *app-data-vault
  data-plane-router-rust: *app-data-vault
  adapter-registry-go:
    networks: !override [net-data, net-vault, net-registry]
  tenant-control: *app-data-vault
  orchestrator: *app-data-vault
  webhook-dispatcher: *app-data-vault
  function-scheduler: *app-data-vault

  # ── backends that dial an engine ────────────────────────────────────────
  realtime: *app-data
  supavisor: *app-data
  gotrue: *app-data
  postgrest: *app-data
  pg-meta: *app-data
  ai-service: *app-data
  analytics-service: *app-data
  email-service: *app-data
  gdpr-service: *app-data
  log-service: *app-data
  mongo-api: *app-data
  newsletter-service: *app-data
  outbox-relay: *app-data
  permission-engine: *app-data
  schema-service: *app-data
  session-service: *app-data
  storage-router: *app-data
  debezium: *app-data
  trino: *app-data
  grafana: *app-data # the Postgres-Usage datasource (read-capable role)

  # ── one-shot init / ops jobs ────────────────────────────────────────────
  db-bootstrap: *app-data
  pg-migrate: *app-data
  pg-backup: *app-data
  mongo-init: *app-data

  # ── vault clients outside the backends ──────────────────────────────────
  vault-init:
    networks: [mini-baas, net-vault]
  prometheus:
    networks: [mini-baas, net-vault]
  kong:
    networks: [mini-baas, net-registry]

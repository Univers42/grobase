# playground plane — playground
services:
  playground:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    # No healthcheck BY DESIGN: dev-only static playground whose content is
    # optional (./playground assets) — a content probe would flap on a bare
    # checkout. Never part of a production edition.
    image: nginx:1.27-alpine
    container_name: mini-baas-playground
    profiles: ["playground"]
    ports:
      # 3100 was a bare literal here and is loki's default (LOKI_PORT), so the
      # two services could never be up at once: with observability running,
      # playground died on "Bind for 127.0.0.1:3100 failed: port is already
      # allocated". Its own default now, and overridable like every other port.
      - "127.0.0.1:${PLAYGROUND_PORT:-3101}:80"
    volumes:
      - ./playground:/usr/share/nginx/html
      - ./playground/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kong:
        condition: service_started

# engines-extra plane — mysql, mariadb, cockroach, mssql
services:
  mysql:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-mysql:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/mysql
      dockerfile: Dockerfile
    container_name: mini-baas-mysql
    profiles: [analytics, data-plane, extras]
    # Only its own variables, never the platform .env (JWT_SECRET, service tokens);
    # operator engine settings (MINIO_*, TZ, …) go in the optional .env.engines.
    env_file:
      - path: .env.engines
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?unset - run make env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_baas}
      MYSQL_USER: ${MYSQL_USER:-mini_baas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?unset - run make env}
    # MySQL 8.4 removed --default-authentication-plugin; caching_sha2_password
    # has been the default since 8.0.4, so no command override is needed.
    ports:
      - "${ENGINE_BIND_ADDR:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:?unset - run make env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5

  # ─── MariaDB (engines-extra — proves engine-agnostic onboarding) ──
  # Wire-compatible with MySQL; served by the SAME Rust adapter under the
  # `mariadb` engine id. Lives in the optional `engines-extra` profile (the
  # `engines` plane / Max package), never in default editions.
  mariadb:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-mariadb:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/mariadb
      dockerfile: Dockerfile
    container_name: mini-baas-mariadb
    profiles: [engines-extra]
    # Only its own variables, never the platform .env (JWT_SECRET, service tokens);
    # operator engine settings (MINIO_*, TZ, …) go in the optional .env.engines.
    env_file:
      - path: .env.engines
        required: false
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?unset - run make env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mini_baas}
      MARIADB_USER: ${MARIADB_USER:-mini_baas}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?unset - run make env}
    ports:
      - "${ENGINE_BIND_ADDR:-127.0.0.1}:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5

  # ─── CockroachDB (engines-extra — distributed-SQL agnosticism proof) ──
  # Speaks the PostgreSQL wire protocol, so it is served by the SAME Rust
  # Postgres adapter under the `cockroachdb` engine id (PgDialect::Cockroach):
  # serializable-only isolation, no LISTEN/NOTIFY streaming. Single insecure
  # node; RAM-capped via --cache/--max-sql-memory so it stays inside mem_limit.
  # Optional `engines-extra` profile (the `engines` plane / Max package).
  cockroach:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-cockroach:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/cockroach
      dockerfile: Dockerfile
    container_name: mini-baas-cockroach
    profiles: [engines-extra]
    # --advertise-addr=cockroach (the in-network alias) lets it listen on all
    # interfaces by default; an explicit --listen-addr=0.0.0.0 is rejected by
    # v24's single-node guard. RAM-capped via --cache/--max-sql-memory.
    command: >
      start-single-node --insecure --advertise-addr=cockroach
      --cache=128MiB --max-sql-memory=128MiB --http-addr=0.0.0.0:8080
    ports:
      - "${ENGINE_BIND_ADDR:-127.0.0.1}:${COCKROACH_PORT:-26257}:26257"
      - "${ENGINE_BIND_ADDR:-127.0.0.1}:${COCKROACH_HTTP_PORT:-28080}:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test:
        [
          "CMD",
          "cockroach",
          "sql",
          "--insecure",
          "--host=127.0.0.1:26257",
          "-e",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  # ─── Microsoft SQL Server (engines-extra — proves TDS agnosticism) ──
  # Served by the Rust tiberius adapter under the `mssql` engine id. SQL Server
  # needs ~2 GB; lives in the optional `engines-extra` profile (the `engines`
  # plane / Max package), NEVER in default editions. Developer edition (free).
  mssql:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-mssql:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/mssql
      dockerfile: Dockerfile
    container_name: mini-baas-mssql
    profiles: [engines-extra]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?unset - run make env}
      MSSQL_PID: Developer
    ports:
      - "${ENGINE_BIND_ADDR:-127.0.0.1}:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -No -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 2g
    cpus: 1.0

  # ─── Iceberg REST Catalog (M2 federation) ────────────────────────

  dynamodb-local:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: amazon/dynamodb-local:latest
    container_name: mini-baas-dynamodb-local
    # The 8th engine's backing store. It was defined in the (now removed) hypertube
    # app plane, which made an engine look like app infrastructure — it is not: the
    # engines-extra profile brings it up with mysql/mariadb/mssql, DynamoDB is an
    # opt-in cargo feature of the data plane, and migration 069's engine CHECK plus
    # engines-extra workspace databases both depend on it. Public image.
    profiles: ["engines-extra"]
    user: root
    command:
      [
        "-jar",
        "DynamoDBLocal.jar",
        "-sharedDb",
        "-dbPath",
        "/home/dynamodblocal/data",
      ]
    # The only engine here with no liveness probe, so `docker ps` reported no
    # health for it at all and "every container healthy" could not be asserted
    # for the tier. A bare GET is answered 400 -- DynamoDB Local wants a signed
    # POST -- so curl runs WITHOUT -f: connecting is the signal, the status code
    # is not. Measured in the running container: 0 when up, 7 when the port is
    # dead. The image carries /usr/bin/curl.
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/curl",
          "-s",
          "-o",
          "/dev/null",
          "http://localhost:8000/",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    # Loopback only, like every other engine here. It was published on 0.0.0.0 —
    # an unauthenticated database reachable from the whole LAN.
    ports:
      - "127.0.0.1:${DYNAMODB_LOCAL_PORT:-8500}:8000"

volumes:
  dynamodb-data:

# gateway plane — waf, kong
services:
  waf:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-waf:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/waf
      dockerfile: Dockerfile
    container_name: mini-baas-waf
    environment:
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      ALLOWED_REQUEST_CONTENT_TYPE: "|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |application/grpc| |application/octet-stream| |image/png| |image/jpeg| |image/gif| |image/webp| |image/svg+xml| |text/plain| |text/csv| |application/pdf|"
    ports:
      - "${WAF_HTTP_PORT:-8880}:80"
      - "${WAF_HTTPS_PORT:-8443}:443"
    secrets:
      - localhost_cert
      - localhost_key
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      # A real HTTPS request through the door dependents use: :443 -> Kong.
      # The old probe grepped /proc/net/tcp for a socket in LISTEN state and
      # never made a request, so the WAF reported healthy with nothing behind
      # it (gate m187). Any non-5xx answer passes -- Kong's 404 for "/" proves
      # the whole path; a 502 means Kong is gone. The image has no curl or
      # bash; openssl s_client is what it ships.
      test:
        - CMD-SHELL
        - "code=$$(printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' | openssl s_client -quiet -connect 127.0.0.1:443 -servername localhost 2>/dev/null | head -n1 | cut -d' ' -f2); [ -n \"$$code\" ] && [ \"$$code\" -lt 500 ]"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  # ─── HashiCorp Vault (control plane: boot/CI secrets) ─────────────
  kong:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-kong:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/kong
      dockerfile: Dockerfile
    container_name: mini-baas-kong
    env_file: [.env]
    ports:
      # Kong is now internal — WAF is the public entrypoint.
      # Keep 8000 exposed on localhost for direct dev access.
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000"
      # SECURITY: the Admin API (:8001) is NOT published to the host — in db-less
      # mode `GET /key-auths` returns the cleartext anon + service_role keys (and
      # /jwts the JWT secret). It stays on 0.0.0.0:8001 inside the container so
      # Prometheus can scrape `kong:8001` over the internal network, but no host
      # process (or host-bound SSRF) can reach it. Re-publish only for debugging.
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_HEADERS: "off"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: "1m"
      KONG_NGINX_HTTP_CLIENT_BODY_TIMEOUT: "1s"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_MEM_CACHE_SIZE: "64m"
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: "cjson.safe"
      JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISS: ${API_EXTERNAL_URL:-http://localhost:8000/auth/v1}
      KONG_ANON_UUID: ${KONG_ANON_UUID:-cd4f782c-ac87-5081-b322-b54834d15651}
    volumes:
      - ./infra/docker/services/kong/conf/kong.yml:/etc/kong/kong.yml.tmpl:ro
    command: >
      sh -ec '
        sed \
          -e "s|__KONG_PUBLIC_API_KEY__|$${KONG_PUBLIC_API_KEY}|g" \
          -e "s|__KONG_SERVICE_API_KEY__|$${KONG_SERVICE_API_KEY}|g" \
          -e "s|__KONG_CORS_ORIGIN_APP__|$${KONG_CORS_ORIGIN_APP}|g" \
          -e "s|__KONG_CORS_ORIGIN_PLAYGROUND__|$${KONG_CORS_ORIGIN_PLAYGROUND}|g" \
          -e "s|__KONG_CORS_ORIGIN_STUDIO__|$${KONG_CORS_ORIGIN_STUDIO}|g" \
          -e "s|__KONG_CORS_ORIGIN_FRONTEND__|$${KONG_CORS_ORIGIN_FRONTEND}|g" \
          -e "s|__JWT_SECRET__|$${JWT_SECRET}|g" \
          -e "s|__GOTRUE_JWT_ISS__|$${GOTRUE_JWT_ISS}|g" \
          -e "s|__KONG_ANON_UUID__|$${KONG_ANON_UUID}|g" \
          /etc/kong/kong.yml.tmpl > /tmp/kong.yml;
        exec /docker-entrypoint.sh kong docker-start
      '
    healthcheck:
      # Asks the proxy listener dependents dial (:8000), not `kong health`,
      # which only checks that nginx PIDs exist and stays green with
      # proxy_listen off (gate m187). Kong's own "no Route matched" 404 for
      # "/" is a correct answer: it proves the router loaded the declarative
      # config and serves HTTP. Pure bash: the image purges curl after install.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && IFS= read -r line <&3 && [[ $$line == HTTP/1.* ]]"
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 10
    depends_on:
      gotrue:
        condition: service_healthy
      postgrest:
        condition: service_started
      realtime:
        condition: service_healthy
        required: false
    mem_limit: 1g
    cpus: 1.0

  # ─── SQL Federation (M2) ─────────────────────────────────────────

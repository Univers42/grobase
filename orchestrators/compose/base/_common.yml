# Shared base — common config every service inherits via Compose `extends` (cross-file reuse).
# Only TRULY-universal fields live here: every service joins the `mini-baas` network and
# defaults to `restart: unless-stopped`. Per-service exceptions stay in the service and win
# on merge (init containers use `restart: "no"`; `env_file`/aliases are per-service).
# NOT listed in the root include: — this is a reusable template, not a plane.
#
# Healthcheck cadence convention (applies to every plane file, not enforceable
# from here because `extends` cannot merge a partial healthcheck): use
# `interval: 30s` + `start_interval: 2s`, never a bare `interval: 5s`.
# A healthcheck is a full `runc` container-exec — MEASURED at ~47 forks per
# invocation on an emulated-I/O dev VM (`nginx -t` 49, `pg_isready` 45). At 5s
# across the running set that was ~5.5 execs/sec ≈ 250 forks/sec of pure
# namespace setup, and the guest measured 136 forks/sec with the stack IDLE.
# `start_interval` keeps probing every 2s until the container first reports
# healthy, so `depends_on: condition: service_healthy` gating is exactly as
# fast as before — the 30s applies only to the steady state, where nothing is
# waiting on the answer. Requires Docker >= 25.
#
# no-new-privileges (N-30, gate m208): no process in any container can gain a
# privilege through exec — setuid/setgid bits (su, passwd, mount … ship in
# mssql, kong, waf, studio, pg-meta, mongo, cockroach, dynamodb-local, mysql,
# mariadb) and file capabilities are ignored. Dropping privileges still works
# (postgres su-exec, vault SKIP_SETCAP + disable_mlock). A service that
# redefines security_opt must keep this entry; CONTAINER_NO_NEW_PRIVILEGES=false
# turns it off everywhere, and preflight-production refuses that without
# CONTAINER_NO_NEW_PRIVILEGES_ACK=1.
services:
  base:
    networks:
      - mini-baas
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:${CONTAINER_NO_NEW_PRIVILEGES:-true}"

  # ts-base is base plus every variable src/libs reads (identity, JWT, Postgres,
  # Mongo, service token, logging, OTEL) as a pass-through: set in .env or the
  # shell, it reaches the service; unset, it stays unset and the code default
  # applies. The NestJS services extend it and list their own reads instead of
  # loading the whole .env (gate m212 holds them to it). Never list a name the
  # image sets (APP_NAME, NODE_ENV): an unset pass-through UNSETS the image's
  # ENV of that name, and m212 refuses that on a running stack.
  ts-base:
    extends: { service: base }
    environment:
      ADAPTER_REGISTRY_DB_USER:
      ADAPTER_REGISTRY_SERVICE_TOKEN:
      ADAPTER_REGISTRY_SERVICE_TOKEN_PREV:
      API_KEY_VERIFY_CACHE_TTL_MS:
      API_KEY_VERIFY_TIMEOUT_MS:
      AUDIT_DATABASE_URL:
      DATABASE_URL:
      GOTRUE_JWT_ISSUER:
      GOTRUE_JWT_SECRET:
      IDEMPOTENCY_REDIS_URL:
      IDEMPOTENCY_TTL_SECONDS:
      IDENTITY_HEADER_MODE:
      IDENTITY_JWT_BEARER_ENABLED:
      IDENTITY_NONCE_REDIS_URL:
      IDENTITY_NONCE_STORE:
      INTERNAL_IDENTITY_HMAC_KEYS:
      INTERNAL_IDENTITY_HMAC_SECRET:
      INTERNAL_IDENTITY_MAX_SKEW_MS:
      INTERNAL_SERVICE_TOKEN:
      JWT_ALLOW_NO_EXP:
      JWT_ALLOW_NO_ISSUER:
      JWT_SECRET:
      JWT_SECRET_PREV:
      LOG_LEVEL:
      LOG_SERVICE_URL:
      MONGO_DB_NAME:
      MONGO_MAX_POOL_SIZE:
      MONGO_MIN_POOL_SIZE:
      MONGO_OPTIONAL:
      MONGO_URI:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_SDK_DISABLED:
      OTEL_SERVICE_NAME:
      REDIS_URL:
      SERVICE_TOKEN_MODE:
      UV_THREADPOOL_SIZE:

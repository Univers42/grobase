# secrets plane — vault, vault-init
services:
  vault:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-vault:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/vault
      dockerfile: Dockerfile
    profiles: [secrets]
    container_name: mini-baas-vault
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/vault.hcl
    environment:
      SKIP_SETCAP: "1"
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=http://127.0.0.1:8200 2>/dev/null | grep -q 'Sealed.*false' || exit 1",
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  # ─── Vault Bootstrap (control plane one-shot) ─────────────────────
  vault-init:
    extends: { file: orchestrators/compose/base/_common.yml, service: base }
    image: ghcr.io/univers42/grobase-vault-init:latest # pull-fallback (built from ./build context below)
    build:
      context: ./infra/docker/services/vault
      dockerfile: Dockerfile
    profiles: [secrets]
    container_name: mini-baas-vault-init
    # Only the variables infra/docker/services/vault/scripts/init-vault.sh copies into Vault's KV,
    # never the whole .env; other settings (the vault CLI's VAULT_*) go in the optional
    # .env.vault-init (gate m212).
    env_file:
      - path: .env.vault-init
        required: false
    environment:
      ADAPTER_REGISTRY_SERVICE_TOKEN:
      FORTYTWO_CLIENT_ID:
      FORTYTWO_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      JWT_SECRET:
      KONG_PUBLIC_API_KEY:
      KONG_SERVICE_API_KEY:
      MINIO_ROOT_PASSWORD:
      MINIO_ROOT_USER:
      MONGO_INITDB_ROOT_PASSWORD:
      MONGO_INITDB_ROOT_USERNAME:
      POSTGRES_DB:
      POSTGRES_PASSWORD:
      POSTGRES_USER:
      SMTP_HOST:
      SMTP_PASS:
      SMTP_PORT:
      SMTP_USER:
      VAULT_ENC_KEY:
      VAULT_ADDR: http://vault:8200
    entrypoint: /vault/scripts/init-vault.sh
    volumes:
      - vault-data:/vault/data
    depends_on:
      vault:
        condition: service_started
    restart: "no"

  # ─── API Gateway ─────────────────────────────────────────────────

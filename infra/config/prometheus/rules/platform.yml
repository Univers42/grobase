# Platform alert rules (Track-2 E2). Every expression targets a metric this
# stack actually exposes — verified live against the running /metrics endpoints,
# not guessed. Validate locally with:
#   promtool check rules infra/config/prometheus/rules/platform.yml
# (the m52 gate runs exactly this.)
groups:
  # ── availability ────────────────────────────────────────────────────────────
  - name: platform-availability
    rules:
      - alert: TargetDown
        # Prometheus' own per-target up gauge — fires when a scrape fails
        # (process crashed / unreachable), which baas_service_up cannot show
        # (it's hardcoded 1 whenever the service is alive enough to be scraped).
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }}/{{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape this target for 2m."

      - alert: TargetVanished
        # A dns_sd target (prometheus.yml) that stopped resolving: Docker's DNS
        # drops a container when it stops, so a crashed optional service leaves
        # the target list instead of reporting up == 0. Fires for any target
        # up at some point in the last hour that is no longer scraped at all.
        # Ponytail: resolves by itself an hour after the container went away,
        # and also fires for a deliberate `make down-<plane>` — both read as
        # "was running, now isn't"; `make ps` tells them apart.
        expr: max_over_time(up[1h]) == 1 unless on (job, instance) up
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}/{{ $labels.instance }} is no longer running"
          description: "The target was scraped within the last hour and no longer resolves (container stopped or removed)."

      - alert: High5xxRatio
        # 5xx share of a service's traffic over 5m, guarded by a minimum request
        # rate so a single error on an idle service doesn't page anyone.
        expr: |
          (
            sum by (service) (rate(baas_http_requests_total{status="5xx"}[5m]))
            /
            sum by (service) (rate(baas_http_requests_total[5m]))
          ) > 0.05
          and
          sum by (service) (rate(baas_http_requests_total[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: 5xx ratio above 5%"
          description: "{{ $labels.service }} has served >5% 5xx over 5m at meaningful traffic."

  # ── data integrity (event loss is never acceptable) ─────────────────────────
  - name: platform-data-integrity
    rules:
      - alert: OutboxEventsDropped
        # The data plane could not enqueue an outbox event — a lost change
        # notification. Page immediately; this is correctness, not capacity.
        expr: increase(baas_data_plane_outbox_events_total{stage="dropped"}[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Data-plane dropped outbox events"
          description: "{{ $value }} outbox event(s) dropped in 10m on {{ $labels.service }}."

      - alert: OutboxWritesFailed
        expr: increase(baas_data_plane_outbox_events_total{stage="failed"}[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Data-plane outbox write failures"
          description: "{{ $value }} outbox write(s) failed in 10m on {{ $labels.service }} (will retry)."

      - alert: WebhookDeadLettering
        # Deliveries exhausting all retries → DLQ. Surfaced by the F2 counter.
        expr: increase(baas_webhook_deliveries_total{outcome="dead"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Webhook deliveries dead-lettering"
          description: "{{ $value }} delivery(ies) gave up after max attempts in 15m on {{ $labels.service }}."

      - alert: RealtimeEventsDropped
        # Slow-consumer overflow = clients silently losing realtime updates
        # (the C4 counter; was a bare debug! before).
        expr: increase(baas_realtime_events_dropped_total{reason="overflow"}[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Realtime gateway dropping events to slow consumers"
          description: "{{ $value }} event(s) dropped (overflow) in 10m — subscribers are missing updates."

  # ── capacity ────────────────────────────────────────────────────────────────
  - name: platform-capacity
    rules:
      - alert: DataPlanePoolsHigh
        # Approaching the default MAX_POOLS=4096 ceiling. With SHARE_POOLS=1 the
        # pool count is independent of tenant count, so a high value here means
        # either per-tenant pools (self-host shape) under real fan-out or a leak.
        expr: baas_data_plane_pools_open > 3500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Data-plane open pools near the MAX_POOLS ceiling"
          description: "{{ $value }} pools open on {{ $labels.service }} (ceiling 4096; consider SHARE_POOLS=1)."

      - alert: WebhookRetryStorm
        # Sustained high retry rate = a subscriber endpoint is flapping; informational.
        expr: |
          sum by (service) (rate(baas_webhook_deliveries_total{outcome="retry"}[10m])) > 1
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Sustained webhook retry rate"
          description: ">1 retry/s over 10m for 15m on {{ $labels.service }} — a subscriber may be flapping."

  # ── security events ─────────────────────────────────────────────────────────
  # Kong sees every client request, so the edge counters are the complete view;
  # the Nest counter adds calls that reached a service without passing Kong
  # (another container, a published dev port). Ponytail: fixed thresholds (1/s
  # sustained for 5m, 0.2/s for the app plane) are a starting point — a busy
  # deployment raises them, a quiet one lowers them.
  - name: platform-security
    rules:
      - alert: AuthFailureSpike
        # Rejected credentials at the edge: brute force, credential stuffing,
        # or a client still sending a rotated key.
        expr: sum by (service) (rate(kong_http_requests_total{code="401"}[5m])) > 1
        for: 5m
        labels: { severity: warning, event_type: auth_failure }
        annotations:
          summary: "{{ $labels.service }}: sustained 401s at the gateway"
          description: "{{ $value | humanize }}/s requests rejected as unauthenticated for 5m."

      - alert: AccessDeniedSpike
        # Authenticated callers refused: probing for other tenants' data, or a
        # policy change that broke a client.
        expr: sum by (service) (rate(kong_http_requests_total{code="403"}[5m])) > 1
        for: 5m
        labels: { severity: warning, event_type: access_denied }
        annotations:
          summary: "{{ $labels.service }}: sustained 403s at the gateway"
          description: "{{ $value | humanize }}/s requests refused for 5m."

      - alert: RateLimitedSpike
        expr: sum by (service) (rate(kong_http_requests_total{code="429"}[5m])) > 1
        for: 5m
        labels: { severity: info, event_type: rate_limited }
        annotations:
          summary: "{{ $labels.service }}: sustained 429s at the gateway"
          description: "{{ $value | humanize }}/s requests rate-limited for 5m."

      - alert: AppPlaneAuthRejections
        # 401/403 counted inside the Nest services themselves.
        expr: |
          sum by (service) (rate(mini_baas_http_requests_total{status_code=~"401|403"}[5m])) > 0.2
        for: 5m
        labels: { severity: warning, event_type: auth_failure }
        annotations:
          summary: "{{ $labels.service }}: sustained 401/403 inside the service"
          description: "{{ $value | humanize }}/s rejected requests for 5m (includes calls that bypassed Kong)."

      - alert: PreviousServiceTokenInUse
        # A peer still authenticates with INTERNAL_SERVICE_TOKEN_PREV. Close the
        # rotation window (clear PREV) only once this has stayed quiet. The
        # series exists only after PREV has accepted a request.
        expr: increase(baas_service_token_previous_accepted_total[15m]) > 0
        for: 0m
        labels: { severity: info, event_type: token_rotation }
        annotations:
          summary: "{{ $labels.job }}/{{ $labels.instance }} accepted the previous service token"
          description: "{{ $value }} request(s) in 15m used INTERNAL_SERVICE_TOKEN_PREV — a peer has not rolled to the new token."

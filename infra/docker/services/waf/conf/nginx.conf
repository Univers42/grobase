# File: docker/services/waf/conf/nginx.conf
# Nginx reverse-proxy to Kong with ModSecurity enabled.
# This is the ONLY public-facing listener; Kong's :8000 becomes internal.

# Pooled connections to Kong (gate m236): without this every request opened a new
# TCP connection to Kong. `resolve` re-reads kong's address every 30 s, as the
# variable proxy_pass did, so a recreated Kong container is still found.
upstream kong_upstream {
    zone kong_upstream 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server kong:8000 resolve;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /run/secrets/localhost_cert;
    ssl_certificate_key /run/secrets/localhost_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # A returning client resumes its TLS session instead of a full handshake.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ── ModSecurity engine ─────────────────────────────────────────
    # ModSecurity is enabled globally by CRS via conf.d/modsecurity.conf.
    # No need to duplicate modsecurity_rules_file here.

    # ── WAF health endpoint (bypasses ModSecurity) ─────────────────
    location = /waf-health {
        modsecurity off;
        access_log off;
        return 200 '{"status":"ok","service":"waf"}';
        add_header Content-Type application/json;
    }

    # ── Proxy settings: server level, so every location below inherits the same
    # headers, timeouts and buffers (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;

    # Client information: this is the edge, so whatever the client says about
    # where it came from is overwritten or dropped (an empty value is not
    # sent). Kong in prod trusts these headers from us (KONG_TRUSTED_IPS), and
    # ipguard + the audit log take the first X-Forwarded-For hop (gate m207).
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host   "";
    proxy_set_header   X-Forwarded-Port   "";
    proxy_set_header   X-Forwarded-Path   "";
    proxy_set_header   X-Forwarded-Prefix "";

    # WebSocket support (Realtime)
    proxy_set_header   Upgrade           $ws_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Buffer tuning
    proxy_buffering       on;
    proxy_buffer_size     16k;
    proxy_buffers         4 32k;
    proxy_busy_buffers_size 64k;

    # Pass body for POST/PUT (needed for API requests)
    client_max_body_size 10m;

    # ── Compression: an ALLOWLIST of data routes only (gate m237, ADR 0003). A route
    # whose body can carry a secret next to reflected input (auth, keys, OTP, signed
    # URLs, rpc, functions, admin) stays uncompressed, so BREACH has nothing to read;
    # a route added to Kong later is uncompressed until it is listed here.
    gzip              off;
    gzip_types        application/json application/vnd.pgrst.object+json application/geo+json text/csv;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_vary         on;
    gzip_proxied      any;

    # Ponytail: table rows are compressed whatever they hold; a table that stores a
    # secret beside attacker-writable text is BREACH-readable over /rest/v1. Keep
    # such columns out of a client-readable table, or drop its path from this list.
    location ~ ^/rest/v1/(?!rpc/) {
        gzip       on;
        proxy_pass http://kong_upstream;
    }
    location ~ ^/data/v1/ {
        gzip       on;
        proxy_pass http://kong_upstream;
    }
    location = /query/v1/execute {
        gzip       on;
        proxy_pass http://kong_upstream;
    }

    # ── Proxy everything else to Kong, uncompressed ───────────────
    location / {
        proxy_pass http://kong_upstream;
    }
}

# WebSocket upgrade maps. Only `Upgrade: websocket` (realtime) is forwarded to
# Kong; any other upgrade token — notably `h2c`, the HTTP/2-cleartext smuggling
# vector that tunnels requests past this WAF — is dropped and the upstream
# connection is closed, so nginx never relays a non-WebSocket upgrade. A request
# with no Upgrade at all sends no Connection header, so its pooled upstream
# connection is kept alive (gate m198 pins all three cases).
map $http_upgrade $ws_upgrade {
    default        "";
    "~*^websocket$" websocket;
}
map $http_upgrade $connection_upgrade {
    default         close;
    ""              "";
    "~*^websocket$" upgrade;
}

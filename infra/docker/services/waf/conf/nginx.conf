# File: docker/services/waf/conf/nginx.conf
# Nginx reverse-proxy to Kong with ModSecurity enabled.
# This is the ONLY public-facing listener; Kong's :8000 becomes internal.

# Pooled connections to Kong (gate m236): without this every request opened a new
# TCP connection to Kong. `resolve` re-reads kong's address every 30 s, as the
# variable proxy_pass did, so a recreated Kong container is still found.
upstream kong_upstream {
    zone kong_upstream 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server kong:8000 resolve;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /run/secrets/localhost_cert;
    ssl_certificate_key /run/secrets/localhost_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # A returning client resumes its TLS session instead of a full handshake.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ── ModSecurity engine ─────────────────────────────────────────
    # ModSecurity is enabled globally by CRS via conf.d/modsecurity.conf.
    # No need to duplicate modsecurity_rules_file here.

    # ── WAF health endpoint (bypasses ModSecurity) ─────────────────
    location = /waf-health {
        modsecurity off;
        access_log off;
        return 200 '{"status":"ok","service":"waf"}';
        add_header Content-Type application/json;
    }

    # ── Proxy settings: server level, so every location below inherits the same
    # headers, timeouts and buffers (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;

    # Client information: this is the edge, so whatever the client says about
    # where it came from is overwritten or dropped (an empty value is not
    # sent). Kong in prod trusts these headers from us (KONG_TRUSTED_IPS), and
    # ipguard + the audit log take the first X-Forwarded-For hop (gate m207).
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host   "";
    proxy_set_header   X-Forwarded-Port   "";
    proxy_set_header   X-Forwarded-Path   "";
    proxy_set_header   X-Forwarded-Prefix "";

    # WebSocket support (Realtime)
    proxy_set_header   Upgrade           $ws_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Buffer tuning
    proxy_buffering       on;
    proxy_buffer_size     16k;
    proxy_buffers         4 32k;
    proxy_busy_buffers_size 64k;

    # Pass body for POST/PUT (needed for API requests)
    client_max_body_size 10m;

    # ── Compression: an ALLOWLIST of data routes only (gate m237, ADR 0003). A route
    # whose body can carry a secret next to reflected input (auth, keys, OTP, signed
    # URLs, rpc, functions, admin) stays uncompressed, so BREACH has nothing to read;
    # a route added to Kong later is uncompressed until it is listed here.
    gzip              off;
    gzip_types        application/json application/vnd.pgrst.object+json application/geo+json text/csv;
    gzip_min_length   1024;
    gzip_comp_level   4;
    gzip_vary         on;
    gzip_proxied      any;

    # Ponytail: table rows are compressed whatever they hold; a table that stores a
    # secret beside attacker-writable text is BREACH-readable over /rest/v1. Keep
    # such columns out of a client-readable table, or drop its path from this list.
    location ~ ^/rest/v1/(?!rpc/) {
        gzip       on;
        proxy_pass http://kong_upstream;
    }
    # An object database is saved whole: the bridge upserts one row whose `state` is the
    # database's schema, views and every record, and ModSecurity reads each JSON leaf as an
    # argument. A 36-row CRM (61 KB, ~1,500 leaves) was refused with a 400 on every save by
    # 200007 (argument count >= MODSEC_ARGUMENTS_LIMIT, 1000) and the bridge answered 502
    # (2026-10-21, b2b WAF log); past 128 KB 200002 refuses it too ("Request body excluding
    # files is bigger than the maximum expected"). Lifting body inspection instead (ctl:
    # requestBodyAccess=Off) skips phase 2 entirely: the `<html` cookie, `\nSet-Cookie:` and
    # request-line controls of m227 then pass. So the limits are raised on this exact path
    # only (an encoded `?` or a suffix normalises to another location) and every leaf is
    # still parsed and inspected; 200007's threshold is the literal 1000, so it goes here
    # too, and past 10,000 leaves the parser stops and 200002 refuses the save.
    # Caveat: CPU grows with the leaves -- 1,500 took 247 ms, 3,000 500 ms, 15,000 3.5 s in
    # the WAF at paranoia 1 (measured 2026-10-21, m227 harness), before Kong sees a key. A
    # database past ~10,000 leaves or 1 MiB is refused, not saved; raising either buys
    # bigger databases with more CPU per unauthenticated request on this path.
    location = /rest/v1/osionos_object_databases {
        modsecurity_rules '
            SecArgumentsLimit 10000
            SecRequestBodyNoFilesLimit 1048576
            SecRuleRemoveById 200007
        ';
        gzip       on;
        proxy_pass http://kong_upstream;
    }
    # A hydrawn whiteboard is saved whole too: the osionos bridge writes one mongo-api
    # document per board, its scene a single JSON string (elements and inline pictures), up
    # to the bridge's 2 MiB body cap, which matches the limit here. A 200 KB board was refused with nginx's 400 by 200002,
    # past 128 KB (2026-10-28, probe through the live WAF). Only the body limit moves, on
    # these two document paths alone (create, and one 24-hex id); the argument limit and
    # 200007 stay, so the scene is one argument among few and a board of 1,001 leaves is
    # still refused. Anchored at both ends and case-sensitive: an encoded `?`, a trailing
    # `/`, an upper-case id or a suffix normalises to another location and keeps 128 KB.
    # Kong gets the raw URI, not the normalised one, so a raw URI that only normalises to
    # these paths (`//`, `%2F`, `/x/../`) is refused here: the three views of the path --
    # this location, $request_uri and ModSecurity's REQUEST_FILENAME -- must agree.
    # Rule 10170 (exclusions.conf) matches the same two shapes.
    # Caveat: the WAF parses up to 2 MiB here before Kong checks a key, and nothing
    # rate-limits ahead of it. Four concurrent 2 MiB bodies OOM-kill a worker of the 256 MiB
    # container, as four 8.5 MiB bodies to ANY path already do under client_max_body_size
    # 10m (2026-10-28, live image, 0.5 CPU, unauthenticated); 8.5 MiB here did it with one.
    # Raising this limit needs a bigger container first, and the bridge's cap moved with it.
    location ~ "^/mongo/v1/collections/hydrawn_boards/documents(/[0-9a-f]{24})?$" {
        if ($request_uri !~ "^/mongo/v1/collections/hydrawn_boards/documents(/[0-9a-f]{24})?(\?.*)?$") { return 400; }
        modsecurity_rules '
            SecRequestBodyNoFilesLimit 2097152
        ';
        proxy_pass http://kong_upstream;
    }
    # A board's thumbnail: the bridge refuses a PNG over 512 KB, so its base64 fits 1 MiB.
    location ~ "^/mongo/v1/collections/hydrawn_thumbnails/documents(/[0-9a-f]{24})?$" {
        if ($request_uri !~ "^/mongo/v1/collections/hydrawn_thumbnails/documents(/[0-9a-f]{24})?(\?.*)?$") { return 400; }
        modsecurity_rules '
            SecRequestBodyNoFilesLimit 1048576
        ';
        proxy_pass http://kong_upstream;
    }
    location ~ ^/data/v1/ {
        gzip       on;
        proxy_pass http://kong_upstream;
    }
    location = /query/v1/execute {
        gzip       on;
        proxy_pass http://kong_upstream;
    }

    # ── Proxy everything else to Kong, uncompressed ───────────────
    location / {
        proxy_pass http://kong_upstream;
    }
}

# WebSocket upgrade maps. Only `Upgrade: websocket` (realtime) is forwarded to
# Kong; any other upgrade token — notably `h2c`, the HTTP/2-cleartext smuggling
# vector that tunnels requests past this WAF — is dropped and the upstream
# connection is closed, so nginx never relays a non-WebSocket upgrade. A request
# with no Upgrade at all sends no Connection header, so its pooled upstream
# connection is kept alive (gate m198 pins all three cases).
map $http_upgrade $ws_upgrade {
    default        "";
    "~*^websocket$" websocket;
}
map $http_upgrade $connection_upgrade {
    default         close;
    ""              "";
    "~*^websocket$" upgrade;
}

# File: docker/services/waf/conf/exclusions.conf
# Installed as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf: the one place CRS
# reads per-application exclusions before its own rules run.
#
# GraphQL through /graphql/v1: a query is a JSON string full of braces and
# bare identifiers -- `{ node { id } }` -- which CRS 932235 (Unix command
# injection) reads as a shell command, and the anomaly score blocks the
# request with an HTML 403. The Laboratory bench found every real query
# refused while `{ __typename }` passed. Scoped three ways: this path only,
# the json.query argument only, the command- and SQL-injection families only.
# Every other rule, argument and path keeps its full inspection.
SecRule REQUEST_URI "@beginsWith /graphql/v1" \
    "id:10100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.query,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.query,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.variables,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.variables"

# osionos content through PostgREST: a page's blocks, a chat message, a comment are
# what a user typed, code included. A code block holding `console.log(` scored 15
# (934100 Node.js injection + 941390 JavaScript method) and every save of that page
# was refused with a 403 (2026-10-11, the direct-link bridge). Scoped three ways:
# writes (POST/PATCH/PUT) only, the app's osionos_* tables only (not rpc), the
# injection families only. Lost on those writes: those families on ARGS, which is
# the JSON body AND the write's query string (`?id=eq.<uuid>` filters) -- regex
# keys (ARGS:/^json\./) do not load in libmodsecurity 3.0.14's ctl, and
# requestBodyAccess=Off skips phase 2 entirely. One rule also loses ARGS_NAMES:
# 930120 (OS file access) read the JSON key path `json.profile.headline` as the
# file `.profile` and refused every profile save at 10 (2026-10-12, the direct
# link's AC1); a key here is a PostgREST column name, and PostgREST refuses one
# that does not exist. Kept: reads, headers, cookies, every other rule on
# ARGS_NAMES, protocol rules, every other path. Every future osionos_* table
# inherits this. The path is REQUEST_FILENAME anchored at both ends, so an encoded
# `?` (osionos_pages%3F/../secrets) cannot borrow the exclusion for another table,
# and the method is matched whole. PostgREST binds every value as a parameter, and
# stored-XSS is the renderer's job, not this edge's (an ssh link never crosses it):
# osionos escapes block text on render, and markdown-engine 83c72a5 closed the one raw
# sink ([color=]/[bg=] into style=""). 921130 (response splitting: `http/<digit>`,
# `<html`, `<meta` in ARGS) is lifted by id, not by tag, on ARGS only: an object
# database titled `HTTP/2 vs HTTP/3` scored exactly 5 on
# ARGS:json.state.pages.<id>.properties.<title> and refused the save (WAF audit
# 179225447561.373534, 2026-10-17). 921130 matches a marker, not a split: the CR/LF a
# split needs is still read by 921150, nginx and Kong re-parse the upstream
# response instead of relaying raw bytes, and a write's response goes to its writer
# alone. 921120 (CR/LF then `Location:`, `Set-Cookie:`, `Host:`... in ARGS) is lifted
# the same way: a page holding a pasted `curl -i` answer (`HTTP/1.1 308 Permanent
# Redirect` then `Location: https://...` on the next line, in a code block) scored 10 on
# ARGS:json.content.array_51.content, and its create and every retry were refused, 57
# times in 40 minutes (b2b WAF log, 2026-10-26 22:23-23:01). A body value reaches a
# response header through one door only, the `Location` PostgREST builds from a primary
# key on insert, and PostgREST 12.2.3 percent-encodes it: a text key
# `a\r\nSet-Cookie: x=1` came back as `Location: /t?token=eq.a%0D%0ASet-Cookie%3A%20x%3D1`
# (throwaway grobase-postgres + grobase-postgrest, 2026-10-26). Cookies, ARGS_NAMES,
# reads, every other path and rpc keep 921120 and 921130. Still refused here: 921110 (a
# request line such as `GET /x HTTP/1.1` in a value; it reads REQUEST_BODY too, which
# this ctl does not reach) and rpc writes (a workspace named `HTTP/2 notes`).
# Caveat: the Location proof is for PostgREST 12.2.3; an upgrade that stopped encoding
# would let a CR/LF in a text key split that one header, with nothing failing here.
# scripts/verify/m227-waf-app-content.sh proves both sides of this rule.
SecRule REQUEST_FILENAME "@rx ^/rest/v1/osionos_[a-z_]+$" \
    "id:10110,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH|PUT)$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssti;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
        ctl:ruleRemoveTargetById=921120;ARGS,\
        ctl:ruleRemoveTargetById=921130;ARGS,\
        ctl:ruleRemoveTargetById=930120;ARGS_NAMES"

# Schema migrations through /admin/v1/migrate: the body IS SQL, so CRS 942350 read
# `; INSERT INTO` in ARGS:json.statements.array_0 as injection and refused every
# migration that carried data (2026-10-12, grobase-cli `db migrate` on the baas VM; a
# bare CREATE TABLE passed). Scoped three ways: POST only, that exact path only
# (@streq, so /admin/v1/migrate-x, a trailing slash or an encoded `?` stay inspected),
# the injection families only, on ARGS -- the array index varies and regex targets do
# not load in this ctl (see 10110). Kong admits the route only for the service-role key
# (acl baas-admin) from private source ranges, and the data plane requires
# role=service_role: the statements no longer inspected here come from the one
# credential that may run DDL anyway. Kept: headers, cookies, protocol rules, every
# other path. scripts/verify/m227-waf-app-content.sh proves both sides.
SecRule REQUEST_FILENAME "@streq /admin/v1/migrate" \
    "id:10120,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssti;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS"

# The SQL runner, POST /query/v1/{database uuid}/sql-ro: its body is {"sql": "..."}, and CRS
# 942100 (libinjection) read `SELECT 1 AS n` as injection, so `grobase query run` got this
# WAF's own 403 from every device (2026-10-12, b2b VM; groot on the VM's host never saw it:
# its ssh link reaches Kong behind the WAF). The first cut of this rule lifted payload.sql on
# /query/v1/execute, which has no raw action, so it exempted an argument the service always
# refuses. Narrower than 10120: POST only, that path shape anchored at both ends (an encoded
# `?` cannot borrow it, see 10110), the injection families only, and only ARGS:json.sql --
# every other argument, headers, /query/v1/execute and every other path keep full
# inspection. What runs is the service's call, not this edge's: one statement, inside a
# READ ONLY transaction, on a tenant_owned postgres mount, with QUERY_ROUTER_SQL_RO on;
# anything else is a 400 or a bare 404. scripts/verify/m227-waf-app-content.sh proves both
# sides.
SecRule REQUEST_FILENAME "@rx ^/query/v1/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/sql-ro$" \
    "id:10140,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-ssti;ARGS:json.sql,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.sql"

# Account mail through POST /email/v1/send: the site gateway sends {to, subject, html, text,
# listUnsubscribe}, and the html part is an HTML document by design. The verification mail
# scored 20 and was refused (2026-10-17, b2b WAF log): 941100 (libinjection), 941160
# (NoScript HTML injection), 941260 (<meta charset=) and 921130 (`<html`), all on
# ARGS:json.html; json.text matched nothing, and neither did any text part of the ten
# messages the site gateway sends (fixtures/m227-email-bodies.json), so json.text keeps full
# inspection. Scoped like 10140: POST only, that exact path (@streq, so /email/v1/send-x, a
# trailing slash or an encoded `?` stay inspected), the XSS family and 921130 only, and only
# ARGS:json.html -- `to`, `subject`, `listUnsubscribe`, `text`, headers, the query string and
# every other family keep full inspection.
# Who may send is Kong's and the mail service's call, not this edge's. What is lifted here
# is the HTML of a message the service hands to SMTP, never a page served to a browser.
# scripts/verify/m227-waf-app-content.sh proves both sides.
# Caveat: families outside this rule still read json.html. A sign-in alert whose user agent
# was `<script>alert(1)</script>` leaves the gateway as `&lt;script&gt;alert(1)&lt;/script&gt;`
# and scores 5 on 932235 (`;script&`, unix command injection): the alert is refused with a 403
# (measured 2026-10-17, m227 audit log). Lifting 932235 needs its own ruling.
SecRule REQUEST_FILENAME "@streq /email/v1/send" \
    "id:10150,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=921130;ARGS:json.html,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.html"

# Not an exclusion: the one refusal that must run before CRS. Tailscale Funnel publishes this
# WAF to the internet as `/ proxy https+insecure://127.0.0.1:8443` (the baas VM, 2026-10-12),
# so every Funnel request arrives from the VM's own loopback, and Kong's ip-restriction
# (10/8, 172.16/12, 192.168/16, 127.0.0.1) on /admin/v1, /meta/v1 and /realtime/v1/publish
# admitted the internet as local: the service-role key alone opened migrations and key
# management from anywhere. tailscaled sets Tailscale-Funnel-Request on every request it
# accepts through Funnel (a client cannot strip it); a tailnet or LAN request never carries
# it, and one that forges it only refuses itself. Existence is matched, not its value ("?1").
# The path is matched decoded, normalised and lowercased, as a prefix like Kong's own paths,
# so `%61dmin`, `//` and `..` reach the same verdict as the route Kong would pick.
# scripts/verify/m227-waf-app-content.sh reads every ip-restricted path out of kong.yml and
# proves each one refused with the header and passed without it.
# Caveat: this trusts tailscaled to mark Funnel traffic. A Tailscale release that stopped
# setting the header would reopen the routes with nothing failing here; the live check is
# a request through the Funnel URL to /admin/v1/tenants, which must answer this rule's 403.
SecRule &REQUEST_HEADERS:Tailscale-Funnel-Request "@gt 0" \
    "id:10130,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Kong private route requested through Tailscale Funnel',\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:admin/v1|meta/v1|realtime/v1/publish)" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Not an exclusion either: rule 10130's sibling for every source that is not Funnel (ADR 0002
# C2). Kong's ip-restriction admits any private address, and the WAF forwards its peer as
# X-Real-IP, so a tailnet device (100.64/10 never matches, but a LAN or container peer does)
# or any container on the app network reached the private routes with the service key alone.
# These routes are now served only to an operator peer: the addresses in
# /etc/modsecurity.d/operator-addresses.txt (conf/operator-addresses.txt) — the WAF's own
# loopback and the app network's gateway, which is how a request to 127.0.0.1:8443 on the VM
# arrives through docker-proxy. REMOTE_ADDR is always the TCP peer: default.conf never loads
# the image's real_ip include, so no header can change it. m227 proves the refusal,
# the forged-header case and the operator pass; measured sources (2026-10-19): loopback 172.18.0.1,
# tailnet 100.119.10.117 (kept), a container on another docker bridge 172.18.0.1.
# Ponytail: the gateway is whatever docker assigned the mini-baas network (172.18.0.1 here,
# not pinned in compose); on another subnet operator loopback is refused (fails closed, use
# Kong on 127.0.0.1:8000). And a container on another docker bridge reaches the WAF as that
# same gateway, so it is still admitted — that is closed at the host, not here.
SecRule REMOTE_ADDR "!@ipMatchFromFile /etc/modsecurity.d/operator-addresses.txt" \
    "id:10131,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Kong private route requested from a non-operator address',\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:admin/v1|meta/v1|realtime/v1/publish)" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# File: docker/services/waf/conf/exclusions.conf
# Installed as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf: the one place CRS
# reads per-application exclusions before its own rules run.
#
# GraphQL through /graphql/v1: a query is a JSON string full of braces and
# bare identifiers -- `{ node { id } }` -- which CRS 932235 (Unix command
# injection) reads as a shell command, and the anomaly score blocks the
# request with an HTML 403. The Laboratory bench found every real query
# refused while `{ __typename }` passed. Scoped three ways: this path only,
# the json.query argument only, the command- and SQL-injection families only.
# Every other rule, argument and path keeps its full inspection.
SecRule REQUEST_URI "@beginsWith /graphql/v1" \
    "id:10100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.query,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.query,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.variables,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.variables"

# osionos content through PostgREST: a page's blocks, a chat message, a comment are
# what a user typed, code included. A code block holding `console.log(` scored 15
# (934100 Node.js injection + 941390 JavaScript method) and every save of that page
# was refused with a 403 (2026-10-11, the direct-link bridge). Scoped three ways:
# writes (POST/PATCH/PUT) only, the app's osionos_* tables only (not rpc), the
# injection families only. Lost on those writes: those families on ARGS, which is
# the JSON body AND the write's query string (`?id=eq.<uuid>` filters) -- regex
# keys (ARGS:/^json\./) do not load in libmodsecurity 3.0.14's ctl, and
# requestBodyAccess=Off skips phase 2 entirely. Kept: reads, headers, cookies,
# ARGS_NAMES, protocol rules, every other path. Every future osionos_* table
# inherits this. The path is REQUEST_FILENAME anchored at both ends, so an encoded
# `?` (osionos_pages%3F/../secrets) cannot borrow the exclusion for another table,
# and the method is matched whole. PostgREST binds every value as a parameter, and
# stored-XSS is the renderer's job, not this edge's (an ssh link never crosses it):
# osionos escapes block text on render, and markdown-engine 83c72a5 closed the one raw
# sink ([color=]/[bg=] into style=""). scripts/verify/m221-waf-app-content.sh proves
# both sides of this rule.
SecRule REQUEST_FILENAME "@rx ^/rest/v1/osionos_[a-z_]+$" \
    "id:10110,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH|PUT)$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-rfi;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-ssti;ARGS,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS"

              size_unit: kilobytes
          - name: rate-limiting
            config:
              policy: local
              limit_by: ip
              minute: 10
              hour: 200

  - name: storage-sign
    url: http://storage-router:3040
    routes:
      - name: storage-sign-routes
        # strip_path:false — storage-router controllers are mounted at the full
        # public path (@Controller('storage/v1')); forward the path verbatim.
        # (Previously strip_path:true on [/storage/v1/sign] 404'd: Kong stripped
        # the whole prefix, leaving /<bucket>/<key> which the controller never
        # matched.) These op-paths are more specific than the minio /storage/v1
        # route, so they win for the storage-router API surface.
        paths: [/storage/v1/sign, /storage/v1/object, /storage/v1/list, /storage/v1/bucket]
        strip_path: false
        plugins:
          - name: key-auth
            config:
              key_names: [apikey]
              hide_credentials: false
          - name: jwt
            config:
              header_names: [authorization]
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false
              anonymous: __KONG_ANON_UUID__
          # This route is MORE SPECIFIC than the minio /storage/v1 route, so it
          # wins for /storage/v1/object — the file UPLOAD path. A 16KB cap here
          # (fine for sign/list/bucket JSON) rejected real uploads with 413; the
          # sibling `storage-routes` already allows 10MB, so match it. The
          # storage-router still enforces STORAGE_MAX_UPLOAD_BYTES (50MB) itself.
          - name: request-size-limiting
            config:
              allowed_payload_size: 10
              size_unit: megabytes
          # Storage object GETs serve gallery images: a single image feed can
          # fetch dozens at once, so a 60/min/IP cap is far too low (429s on a
          # normal scroll). Raised for read-heavy media; the 10MB upload size
          # cap above is the real abuse guard.
          - name: rate-limiting
            config:
              policy: local
              limit_by: ip
              minute: 600
              hour: 15000


# File: infra/docker/services/trino/conf/catalog/iceberg-minio-tls.properties
# Trino Iceberg catalog (M2 federation) under ENGINE_TLS_ENGINES=minio (ADR 0030): the
# base iceberg.properties with an https:// s3.endpoint, mounted over it by the overlay.
# Gate m262 checks every other line equals the base.
# Uses the REST catalog server (`iceberg-rest` service) backed by MinIO via
# S3-compatible API. The warehouse path lives in the `iceberg` bucket which
# is created at bootstrap by the `minio-init` job (see docker-compose.yml).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://iceberg/
iceberg.file-format=parquet
fs.native-s3.enabled=true
s3.endpoint=https://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

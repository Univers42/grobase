# The playground is dev-only static content served beside the gateway. This
# file exists because compose bind-mounts it read-only: a missing bind source
# makes Docker create a DIRECTORY at the path, and the container then dies
# with "not a directory" on every later `up` until someone deletes it by hand.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets only; anything unknown falls back to the page rather than
    # a bare 404, so dropping a single-page app in ./playground just works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
